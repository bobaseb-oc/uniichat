# The iOS app (ios/), built on GitHub's macOS runners; run by hand
# (Actions > ios > Run workflow).
# `shots`: a simulator build, its screenshots kept as the artifact
# `shots`. `testflight`: signed with the team's App Store Connect key
# (repo secrets) and uploaded to TestFlight, numbered by the run.
name: ios
on:
  workflow_dispatch:
    inputs:
      lane:
        type: choice
        options: [shots, testflight]
        default: shots
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # XcodeGen pinned, checked against its release's sha256 before unzip
      - name: xcodegen
        env:
          XCODEGEN: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - if: inputs.lane == 'shots'
        run: ios/ios.sh shots "$RUNNER_TEMP/shots"
      - if: inputs.lane == 'shots'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shots
          path: ${{ runner.temp }}/shots
      - if: inputs.lane == 'testflight'
        run: ios/ios.sh testflight
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY: ${{ secrets.ASC_KEY }}
          BUILD: ${{ github.run_number }}
